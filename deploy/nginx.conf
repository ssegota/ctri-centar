# CTRL — nginx site config
# Put at /etc/nginx/sites-available/ctrl.unipu.hr and symlink into sites-enabled.
#
# nginx serves the built SPA from /opt/ctrl/dist and proxies /api/* to
# the Node process run by deploy/ctrl.service. The certificate must
# exist before this file loads — see DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name ctrl.unipu.hr;
    return 301 https://ctrl.unipu.hr$request_uri;
}

server {
    # Parameter form, not `http2 on;` — the host's nginx predates 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ctrl.unipu.hr;

    root /opt/ctrl/dist;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ctrl.unipu.hr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctrl.unipu.hr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # No Content-Security-Policy yet: index.html carries an inline theme
    # script, so a CSP needs a hash for it. Add one once the markup settles.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # The API builds invite links from Host and sets the Secure cookie
        # flag from X-Forwarded-Proto — both must be the public values.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    # ---- static ------------------------------------------------------------
    # Vite puts a content hash in every filename under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/book, /apply, …) all load index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/ctrl.unipu.hr.access.log;
    error_log  /var/log/nginx/ctrl.unipu.hr.error.log;
}
