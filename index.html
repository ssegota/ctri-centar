<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CTRL — Centar za tehnološki razvoj Istarske županije</title>
    <meta
      name="description"
      content="Otvorena radionica i laboratorij u kojem studenti, istraživači i poduzetnici iz Istre razvijaju fizičke proizvode — od prve skice do funkcionalnog prototipa."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CTRL — Centar za tehnološki razvoj Istarske županije" />
    <meta property="og:description" content="Tehnologija koja povezuje Istru. Znanje. Infrastruktura. Suradnja." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint so the page never flashes light.
      (function () {
        try {
          var t = localStorage.getItem('ctri.theme')
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#0f2231' : '#ffffff')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
