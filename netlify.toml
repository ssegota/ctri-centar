[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# No /api/* rule here on purpose. netlify/functions/api.js declares
# `config.path = "/api/*"`, and Netlify matches serverless functions BEFORE
# redirects, so the SPA fallback below can never swallow an API call. Adding a
# rewrite to /.netlify/functions/api would in fact break it: setting a custom
# path removes the default /.netlify/functions/<name> endpoint.

# SPA fallback — anything that is not an API route or a real file serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
